<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mindora AI</title>
  <meta name="theme-color" content="#7c3aed"/>
  <meta name="description" content="AI-powered gamified learning for Grade 2-12 students"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#09090f;font-family:'DM Sans','Helvetica Neue',sans-serif;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes confettiFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(0.3)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .subj-card:hover{border-color:#7c3aed!important;transform:scale(1.02);transition:all 0.2s;}
    textarea:focus{border-color:#7c3aed!important;outline:none}
    .btn-hover:hover{opacity:0.88;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ⚡ PASTE YOUR GROQ API KEY BETWEEN THE QUOTES BELOW ⚡
    const GROQ_API_KEY = "";

    const LANGUAGES = ["English","Hindi","Telugu","Tamil","Kannada","Spanish","French","Malayalam","Bengali","Marathi"];
    const INDIA_SUBJECTS = {
      "2-5":["Mathematics","English","EVS","Hindi","General Knowledge"],
      "6-8":["Mathematics","Science","Social Science","English","Hindi","Sanskrit"],
      "9-10":["Mathematics","Science","Social Science","English","Hindi","Sanskrit","Computer Science"],
      "11-12":["Physics","Chemistry","Mathematics","Biology","English","Economics","History","Geography","Computer Science","Political Science"],
    };
    const USA_SUBJECTS = {
      "2-5":["Math","English / ELA","Science","Social Studies","Art","Physical Education"],
      "6-8":["Math","Science","English","History","Geography","Civics","Computer Science"],
      "9-12":["Algebra","Geometry","Biology","Chemistry","Physics","English Literature","US History","World History","Economics","Computer Science"],
    };
    const GRADE_GROUP=(g)=>g<=5?"2-5":g<=8?"6-8":g<=10?"9-10":"11-12";
    const USA_GRADE_GROUP=(g)=>g<=5?"2-5":g<=8?"6-8":"9-12";
    const LEVELS=[
      {name:"Rookie",min:0,icon:"🌱",color:"#34d399"},
      {name:"Explorer",min:100,icon:"🔭",color:"#60a5fa"},
      {name:"Scholar",min:300,icon:"📚",color:"#a78bfa"},
      {name:"Wizard",min:600,icon:"🧙",color:"#f59e0b"},
      {name:"Genius",min:1000,icon:"🧠",color:"#f87171"},
      {name:"Legend",min:1500,icon:"👑",color:"#fbbf24"},
    ];
    const C={bg:"#09090f",card:"#10111c",border:"#1c1d2e",accent:"#7c3aed",accentLight:"#a78bfa",accentGlow:"rgba(124,58,237,0.15)",green:"#34d399",yellow:"#fbbf24",red:"#f87171",blue:"#60a5fa",orange:"#fb923c",text:"#f0eeff",muted:"#5a5b7a",subtle:"#14152a"};
    function getLevel(xp){let lv=LEVELS[0];for(const l of LEVELS){if(xp>=l.min)lv=l;}return lv;}
    function nextLevel(xp){for(let i=0;i<LEVELS.length-1;i++){if(xp<LEVELS[i+1].min)return LEVELS[i+1];}return null;}
    function parse(t){try{return JSON.parse(t.replace(/```json|```/g,"").trim());}catch{return null;}}
    function getPopularTopics(subject){
      const map={"Mathematics":["Fractions","Algebra","Geometry","Trigonometry","Probability","Integers"],"Math":["Fractions","Equations","Geometry","Statistics","Ratios","Algebra"],"Science":["Photosynthesis","Gravity","Atoms","Cell Structure","Ecosystems","Electricity"],"Physics":["Newton's Laws","Waves","Thermodynamics","Optics","Magnetism"],"Chemistry":["Periodic Table","Chemical Bonds","Acids & Bases","Organic Chemistry"],"Biology":["DNA","Cell Division","Evolution","Ecosystems","Human Body"],"English":["Tenses","Parts of Speech","Comprehension","Essay Writing","Figures of Speech"],"History":["Ancient Civilizations","World War 2","Indian Independence","French Revolution"],"Social Science":["Democracy","Natural Resources","Climate","Indian Constitution","Trade"],"Computer Science":["Algorithms","HTML Basics","Python","Data Structures","AI & ML"]};
      return(map[subject]||["Introduction","Chapter 1","Key Concepts","Basics","Advanced Topics"]).slice(0,6);
    }
    function XPBar({xp}){
      const lv=getLevel(xp);const nl=nextLevel(xp);
      const pct=nl?Math.round(((xp-lv.min)/(nl.min-lv.min))*100):100;
      return(<div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:18}}>{lv.icon}</span><div style={{flex:1}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:lv.color}}>{lv.name}</span><span style={{fontSize:11,color:C.muted}}>{xp} XP</span></div><div style={{height:6,background:C.border,borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:lv.color,borderRadius:99,transition:"width 0.6s ease"}}/></div></div></div>);
    }
    function Confetti({show}){
      if(!show)return null;
      const dots=Array.from({length:24},(_,i)=>({left:`${Math.random()*100}%`,top:`${Math.random()*100}%`,color:[C.accent,C.green,C.yellow,C.blue,C.orange][i%5],size:6+Math.random()*8,delay:Math.random()*0.5}));
      return(<div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:999}}>{dots.map((d,i)=>(<div key={i} style={{position:"absolute",left:d.left,top:d.top,width:d.size,height:d.size,background:d.color,borderRadius:"50%",animation:`confettiFly 1.2s ${d.delay}s ease forwards`,opacity:0}}/>))}</div>);
    }
    function Footer(){
      return(<footer style={{width:"100%",maxWidth:460,margin:"40px auto 0",padding:"24px 20px",borderTop:"1px solid #1c1d2e",textAlign:"center"}}><div style={{fontSize:28,marginBottom:8}}>⚡</div><div style={{fontSize:17,fontWeight:900,color:"#a78bfa"}}>Tenugu Goutham</div><div style={{fontSize:12,color:"#fbbf24",fontWeight:700,marginTop:4}}>🏆 World's First 14-Year-Old to Build an AI Education Platform</div><div style={{fontSize:12,color:"#5a5b7a",marginTop:10,lineHeight:1.8}}>While most 14-year-olds are playing games,<br/><span style={{color:"#a78bfa"}}>Goutham is building the future of education.</span><br/>From Warangal 🇮🇳 to the world 🌍 — one lesson at a time.</div><div style={{display:"flex",justifyContent:"center",gap:8,flexWrap:"wrap",marginTop:14}}>{["🚀 Self-taught developer","🧠 AI builder @ 14","💡 EdTech founder","🇮🇳 Warangal, India"].map(t=>(<span key={t} style={{padding:"5px 12px",borderRadius:999,fontSize:11,fontWeight:600,background:"rgba(167,139,250,0.1)",color:"#a78bfa",border:"1px solid rgba(167,139,250,0.2)"}}>{t}</span>))}</div><div style={{fontSize:11,color:"#3a3b5a",marginTop:16}}>© 2025 Mindora AI · Built with 💜 by Tenugu Goutham</div></footer>);
    }
    function App(){
      const [screen,setScreen]=useState("home");
      const [grade,setGrade]=useState(null);
      const [board,setBoard]=useState(null);
      const [subject,setSubject]=useState(null);
      const [language,setLanguage]=useState("English");
      const [topic,setTopic]=useState("");
      const [loading,setLoading]=useState(false);
      const [lesson,setLesson]=useState(null);
      const [error,setError]=useState(null);
      const [quizState,setQuizState]=useState({});
      const [quizDone,setQuizDone]=useState(false);
      const [xp,setXp]=useState(0);
      const [streak]=useState(3);
      const [showConfetti,setShowConfetti]=useState(false);
      const [xpGain,setXpGain]=useState(0);
      const [coins,setCoins]=useState(120);
      const [activeTab,setActiveTab]=useState("lesson");
      const subjects=board==="India"?(INDIA_SUBJECTS[GRADE_GROUP(grade)]||[]):(USA_SUBJECTS[USA_GRADE_GROUP(grade)]||[]);
      async function generateLesson(){
        if(!topic.trim())return;
        setLoading(true);setError(null);setLesson(null);setQuizState({});setQuizDone(false);setActiveTab("lesson");
        try{
          const prompt=`You are Mindora AI, a fun gamified AI tutor for Grade ${grade} students (${board} curriculum). Teach "${topic}" in ${subject} in ${language} language. Make it FUN with emojis. Return ONLY valid JSON: {"title":"...","emoji":"...","funFact":"...","story":"2 sentence story","points":[{"heading":"...","detail":"..."},{"heading":"...","detail":"..."},{"heading":"...","detail":"..."},{"heading":"...","detail":"..."}],"remember":"one golden rule","quiz":[{"question":"...","options":["A","B","C","D"],"correct":0,"explanation":"..."},{"question":"...","options":["A","B","C","D"],"correct":1,"explanation":"..."},{"question":"...","options":["A","B","C","D"],"correct":2,"explanation":"..."},{"question":"...","options":["A","B","C","D"],"correct":0,"explanation":"..."},{"question":"...","options":["A","B","C","D"],"correct":3,"explanation":"..."}]}`;
          const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_API_KEY}`},body:JSON.stringify({model:"llama-3.1-8b-instant",max_tokens:1500,messages:[{role:"system",content:"You are Mindora AI. Always respond with valid JSON only, no markdown, no extra text."},{role:"user",content:prompt}]})});
          const data=await res.json();
          const raw=data.choices?.[0]?.message?.content||"";
          const parsed=parse(raw);
          if(!parsed)throw new Error("Could not load lesson. Please try again!");
          setLesson(parsed);setScreen("lesson");
        }catch(e){setError(e.message);}
        setLoading(false);
      }
      function answerQuiz(qi,oi){if(quizState[qi]!==undefined)return;setQuizState(s=>({...s,[qi]:oi}));}
      function finishQuiz(){
        const correct=lesson.quiz.filter((_,i)=>quizState[i]===lesson.quiz[i].correct).length;
        const gained=correct*20+(correct===lesson.quiz.length?50:0);
        setXp(x=>x+gained);setCoins(c=>c+correct*5);setXpGain(gained);setQuizDone(true);
        if(correct>=3){setShowConfetti(true);setTimeout(()=>setShowConfetti(false),2500);}
      }
      function reset(){setScreen("subject");setLesson(null);setTopic("");setQuizState({});setQuizDone(false);}
      const wrap={width:"100%",maxWidth:480,padding:"0 20px",margin:"0 auto"};
      const cardStyle={background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:20,marginBottom:14};
      const btnStyle=(active)=>({width:"100%",padding:16,borderRadius:14,background:active?C.accent:C.border,color:active?"#fff":C.muted,fontWeight:800,fontSize:15,border:"none",cursor:active?"pointer":"not-allowed",transition:"all 0.2s"});
      if(screen==="home")return(<div style={{minHeight:"100vh",background:C.bg,color:C.text,paddingBottom:60}}><Confetti show={showConfetti}/><div style={wrap}><div style={{textAlign:"center",padding:"40px 0 28px"}}><div style={{fontSize:52}}>🧠</div><h1 style={{fontSize:30,fontWeight:900,margin:"8px 0 0",letterSpacing:"-1px",background:"linear-gradient(135deg,#a78bfa,#60a5fa)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Mindora AI</h1><p style={{color:C.muted,fontSize:11,marginTop:6,letterSpacing:"2px",textTransform:"uppercase"}}>Learn · Play · Level Up</p></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:24}}>{[["🔥","Streak",`${streak} days`],["⭐","XP",`${xp} pts`],["🪙","Coins",`${coins}`]].map(([ico,lbl,val],i)=>(<div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 10px",textAlign:"center"}}><div style={{fontSize:22}}>{ico}</div><div style={{fontSize:18,fontWeight:800,color:C.text,marginTop:2}}>{val}</div><div style={{fontSize:10,color:C.muted,letterSpacing:"1px",textTransform:"uppercase"}}>{lbl}</div></div>))}</div><XPBar xp={xp}/><div style={{marginTop:28}}><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:12}}>Select Your Board</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>{[["India","🇮🇳","CBSE / ICSE / State"],["USA","🇺🇸","Common Core"]].map(([val,flag,sub])=>(<div key={val} onClick={()=>setBoard(val)} className="subj-card" style={{background:board===val?"rgba(124,58,237,0.15)":C.card,border:`1.5px solid ${board===val?"#a78bfa":C.border}`,borderRadius:14,padding:"18px 12px",textAlign:"center",cursor:"pointer"}}><div style={{fontSize:28}}>{flag}</div><div style={{fontSize:14,fontWeight:700,marginTop:4,color:board===val?"#a78bfa":C.text}}>{val}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{sub}</div></div>))}</div><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:12}}>Select Grade</div><div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>{Array.from({length:11},(_,i)=>i+2).map(g=>(<div key={g} onClick={()=>setGrade(g)} style={{width:48,height:48,borderRadius:12,background:grade===g?C.accent:C.card,border:`1.5px solid ${grade===g?C.accent:C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,cursor:"pointer",color:grade===g?"#fff":C.text,transition:"all 0.15s"}}>{g}</div>))}</div><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:12}}>Language</div><div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:28}}>{LANGUAGES.map(l=>(<div key={l} onClick={()=>setLanguage(l)} style={{padding:"7px 14px",borderRadius:999,fontSize:12,fontWeight:600,cursor:"pointer",background:language===l?"rgba(124,58,237,0.15)":C.subtle,border:`1px solid ${language===l?"#a78bfa":C.border}`,color:language===l?"#a78bfa":C.muted,transition:"all 0.15s"}}>{l}</div>))}</div><button className="btn-hover" onClick={()=>{if(board&&grade)setScreen("subject");}} style={btnStyle(board&&grade)}>Let's Go! 🚀</button></div></div><Footer/></div>);
      if(screen==="subject")return(<div style={{minHeight:"100vh",background:C.bg,color:C.text,paddingBottom:60}}><div style={wrap}><div style={{padding:"28px 0 20px",display:"flex",alignItems:"center",gap:12}}><button onClick={()=>setScreen("home")} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 14px",color:C.muted,cursor:"pointer",fontSize:13}}>← Back</button><div><div style={{fontSize:18,fontWeight:800,color:C.text}}>Grade {grade} — {board}</div><div style={{fontSize:11,color:C.muted}}>Language: {language}</div></div></div><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:14}}>Choose a Subject</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:28}}>{subjects.map((s,i)=>{const icons=["📐","📖","🔬","🌍","🎨","💻","🧪","📊","🗺️","⚗️"];return(<div key={s} onClick={()=>{setSubject(s);setScreen("topic");}} className="subj-card" style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:16,padding:"18px 14px",cursor:"pointer"}}><div style={{fontSize:26}}>{icons[i%icons.length]}</div><div style={{fontSize:14,fontWeight:700,color:C.text,marginTop:6}}>{s}</div></div>);})}</div></div><Footer/></div>);
      if(screen==="topic")return(<div style={{minHeight:"100vh",background:C.bg,color:C.text,paddingBottom:60}}><div style={wrap}><div style={{padding:"28px 0 20px",display:"flex",alignItems:"center",gap:12}}><button onClick={()=>setScreen("subject")} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 14px",color:C.muted,cursor:"pointer",fontSize:13}}>← Back</button><div style={{fontSize:18,fontWeight:800,color:C.text}}>{subject}</div></div><div style={cardStyle}><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:10}}>What do you want to learn?</div><textarea value={topic} onChange={e=>setTopic(e.target.value)} placeholder={`e.g. "Photosynthesis", "Algebra", "World War 2"...`} style={{width:"100%",minHeight:100,background:C.subtle,border:`1px solid ${C.border}`,borderRadius:12,padding:14,color:C.text,fontSize:14,lineHeight:1.7,resize:"vertical",fontFamily:"inherit"}}/></div><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:12}}>Popular Topics</div><div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:24}}>{getPopularTopics(subject).map(t=>(<div key={t} onClick={()=>setTopic(t)} style={{padding:"7px 14px",borderRadius:999,fontSize:12,fontWeight:600,cursor:"pointer",background:topic===t?"rgba(124,58,237,0.15)":C.subtle,border:`1px solid ${topic===t?"#a78bfa":C.border}`,color:topic===t?"#a78bfa":C.muted}}>{t}</div>))}</div>{error&&<div style={{background:"rgba(248,113,113,0.1)",border:"1px solid rgba(248,113,113,0.3)",borderRadius:12,padding:"12px 16px",color:C.red,fontSize:13,marginBottom:14}}>⚠️ {error}</div>}<button className="btn-hover" onClick={generateLesson} style={btnStyle(topic.trim()&&!loading)}>{loading?"✨ Generating your lesson...":"🎮 Start Learning!"}</button>{loading&&<div style={{textAlign:"center",marginTop:24}}><div style={{width:36,height:36,border:`3px solid ${C.border}`,borderTop:`3px solid ${C.accent}`,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto"}}/><div style={{fontSize:13,color:C.muted,marginTop:12}}>Building your lesson... ✨</div></div>}</div><Footer/></div>);
      if(screen==="lesson"&&lesson){
        const correct=lesson.quiz.filter((_,i)=>quizState[i]===lesson.quiz[i].correct).length;
        const allAnswered=Object.keys(quizState).length===lesson.quiz.length;
        return(<div style={{minHeight:"100vh",background:C.bg,color:C.text,paddingBottom:60}}><Confetti show={showConfetti}/><div style={wrap}><div style={{padding:"24px 0 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}><button onClick={reset} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 14px",color:C.muted,cursor:"pointer",fontSize:13}}>← Back</button><div style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:12,color:C.muted}}>🔥 {streak}</span><span style={{fontSize:12,color:C.yellow}}>⭐ {xp} XP</span><span style={{fontSize:12,color:C.yellow}}>🪙 {coins}</span></div></div><div style={{background:"linear-gradient(135deg,rgba(124,58,237,0.13),rgba(96,165,250,0.07))",border:"1px solid rgba(167,139,250,0.2)",borderRadius:20,padding:"20px",marginBottom:14,textAlign:"center"}}><div style={{fontSize:40}}>{lesson.emoji}</div><div style={{fontSize:20,fontWeight:900,marginTop:8,color:C.text}}>{lesson.title}</div><div style={{fontSize:12,color:C.muted,marginTop:4}}>Grade {grade} · {subject} · {language}</div></div><div style={{display:"flex",gap:8,marginBottom:14}}>{["lesson","quiz"].map(t=>(<div key={t} onClick={()=>setActiveTab(t)} style={{flex:1,padding:"11px",borderRadius:12,border:`1.5px solid ${activeTab===t?"#a78bfa":C.border}`,background:activeTab===t?"rgba(124,58,237,0.15)":C.card,color:activeTab===t?"#a78bfa":C.muted,fontSize:13,fontWeight:700,cursor:"pointer",textAlign:"center"}}>{t==="lesson"?"📖 Lesson":"🎯 Quiz"}</div>))}</div>{activeTab==="lesson"&&(<div><div style={{background:"rgba(251,191,36,0.08)",border:"1px solid rgba(251,191,36,0.2)",borderRadius:14,padding:"14px 16px",marginBottom:12,fontSize:13,color:C.yellow,lineHeight:1.6}}>💡 <strong>Fun Fact:</strong> {lesson.funFact}</div><div style={cardStyle}><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:8}}>🎬 Story Time</div><div style={{fontSize:14,color:C.text,lineHeight:1.8}}>{lesson.story}</div></div><div style={cardStyle}><div style={{fontSize:11,letterSpacing:"2px",color:C.muted,textTransform:"uppercase",marginBottom:12}}>🔑 Key Points</div>{lesson.points?.map((p,i)=>(<div key={i} style={{display:"flex",gap:12,marginBottom:14,alignItems:"flex-start"}}><div style={{width:28,height:28,borderRadius:8,background:"rgba(124,58,237,0.15)",color:"#a78bfa",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,flexShrink:0}}>{i+1}</div><div><div style={{fontSize:14,fontWeight:700,color:C.text}}>{p.heading}</div><div style={{fontSize:13,color:C.muted,marginTop:3,lineHeight:1.6}}>{p.detail}</div></div></div>))}</div><div style={{background:"rgba(52,211,153,0.08)",border:"1px solid rgba(52,211,153,0.2)",borderRadius:14,padding:"14px 16px",marginBottom:16,fontSize:13,color:C.green,lineHeight:1.6}}>🏆 <strong>Golden Rule:</strong> {lesson.remember}</div><button className="btn-hover" onClick={()=>setActiveTab("quiz")} style={{width:"100%",padding:16,borderRadius:14,background:C.accent,color:"#fff",fontWeight:800,fontSize:15,border:"none",cursor:"pointer"}}>Ready for the Quiz? 🎯</button></div>)}{activeTab==="quiz"&&(<div>{quizDone&&(<div style={{background:correct>=4?"rgba(52,211,153,0.1)":"rgba(251,191,36,0.08)",border:`1px solid ${correct>=4?C.green:C.yellow}40`,borderRadius:16,padding:20,textAlign:"center",marginBottom:16}}><div style={{fontSize:44,fontWeight:900,color:correct===5?C.green:correct>=3?C.yellow:C.red}}>{correct}/5</div><div style={{fontSize:14,fontWeight:700,marginTop:4,color:C.text}}>{correct===5?"🎉 PERFECT SCORE! LEGENDARY!":correct>=3?"👍 Great job! Keep going!":"📚 Keep studying, you'll get it!"}</div>{xpGain>0&&<div style={{marginTop:8,fontSize:13,color:C.yellow}}>+{xpGain} XP earned! 🌟</div>}</div>)}{lesson.quiz.map((q,qi)=>(<div key={qi} style={cardStyle}><div style={{fontSize:14,fontWeight:700,marginBottom:12,color:C.text}}>{qi+1}. {q.question}</div>{q.options.map((opt,oi)=>{const picked=quizState[qi]!==undefined;const isChosen=quizState[qi]===oi;const isCorrect=q.correct===oi;let bg=C.subtle,border=`1px solid ${C.border}`,color=C.text;if(picked&&isChosen&&isCorrect){bg="rgba(52,211,153,0.12)";border=`1px solid ${C.green}`;color=C.green;}else if(picked&&isChosen&&!isCorrect){bg="rgba(248,113,113,0.12)";border=`1px solid ${C.red}`;color=C.red;}else if(picked&&isCorrect){bg="rgba(52,211,153,0.12)";border=`1px solid ${C.green}`;color=C.green;}return <div key={oi} onClick={()=>answerQuiz(qi,oi)} style={{padding:"12px 14px",borderRadius:10,background:bg,border,color,fontSize:14,cursor:picked?"default":"pointer",marginBottom:8,transition:"all 0.15s"}}>{opt}</div>;})} {quizState[qi]!==undefined&&q.explanation&&(<div style={{fontSize:12,color:C.blue,marginTop:8,padding:"8px 12px",background:"rgba(96,165,250,0.08)",borderRadius:8,lineHeight:1.6}}>💬 {q.explanation}</div>)}</div>))}{!quizDone&&allAnswered&&<button className="btn-hover" onClick={finishQuiz} style={{width:"100%",padding:16,borderRadius:14,background:C.green,color:"#0a0a0a",fontWeight:800,fontSize:15,border:"none",cursor:"pointer",marginTop:4}}>Submit & Get Results 🏆</button>}{quizDone&&<button className="btn-hover" onClick={reset} style={{width:"100%",padding:16,borderRadius:14,background:C.accent,color:"#fff",fontWeight:800,fontSize:15,border:"none",cursor:"pointer"}}>🔄 Learn Something New</button>}</div>)}</div><Footer/></div>);
      }
      return null;
    }
    const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
